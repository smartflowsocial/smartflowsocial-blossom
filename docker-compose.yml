# Development only. Do not run this file on a public server.
#
# MinIO and the Blossom API are bound to 127.0.0.1. Containers on this
# network still reach MinIO at http://minio:9000.
#
# minioadmin and SFS_UPLOAD_TOKEN_SECRET below are development defaults.
# They are not production credentials. Image tags are pinned releases.
services:
  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/blossom || true;
      "
    restart: "no"

  blossom:
    build: .
    image: ghcr.io/smartflowsocial/smartflowsocial-blossom
    restart: unless-stopped
    environment:
      DB_PATH: /data
      PORT: "5050"
      NODE_ENV: development
      R2_BUCKET: blossom
      R2_ENDPOINT: http://minio:9000
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadmin
      SFS_UPLOAD_TOKEN_SECRET: dev-upload-token-secret
      BLOSSOM_PUBLIC_URL: http://localhost:5050
      AUTH_TOLERANCE_SECONDS: "60"
    ports:
      - "127.0.0.1:5050:5050"
    volumes:
      - blossom:/data
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  minio: {}
  blossom: {}
