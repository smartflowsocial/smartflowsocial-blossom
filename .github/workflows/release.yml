name: Release Security

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact commit to check out. Empty uses the workflow ref.
        required: false
        default: ""
        type: string
      image_digest:
        description: Published image digest, including sha256:. When set, pull that image. Do not build or push.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  security-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.candidate_sha || github.sha }}

      - name: Pull the published image
        if: github.event_name == 'workflow_dispatch' && inputs.image_digest != ''
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          case "$IMAGE_DIGEST" in
            sha256:*) ;;
            *)
              echo "image_digest must start with sha256:"
              exit 1
              ;;
          esac
          if [ -z "$CANDIDATE_SHA" ]; then
            echo "candidate_sha is required when image_digest is set"
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$CANDIDATE_SHA" ]; then
            echo "checked out ${actual}, expected ${CANDIDATE_SHA}"
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY}@${IMAGE_DIGEST}"
          docker pull "$image"
          echo "IMAGE_TAG=verify-${actual:0:12}" >> "$GITHUB_ENV"
          echo "IMAGE_REF=${image}" >> "$GITHUB_ENV"
          {
            echo "source=${actual}"
            echo "digest=${IMAGE_DIGEST}"
            echo "image=${image}"
          } | tee verification.txt

      - name: Setup pnpm
        if: github.event_name != 'workflow_dispatch' || inputs.image_digest == ''
        uses: pnpm/action-setup@v6
        with:
          version: 12.21.0

      - name: Set up Node
        if: github.event_name != 'workflow_dispatch' || inputs.image_digest == ''
        uses: actions/setup-node@v7
        with:
          node-version: "26.13.1"
          cache: pnpm

      - name: Install dependencies
        if: github.event_name != 'workflow_dispatch' || inputs.image_digest == ''
        run: pnpm install --frozen-lockfile

      - name: Run dependency audit
        if: github.event_name != 'workflow_dispatch' || inputs.image_digest == ''
        run: pnpm audit --prod --audit-level high

      - name: Build app image
        if: github.event_name != 'workflow_dispatch' || inputs.image_digest == ''
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME//\//-}"
          image="ghcr.io/${GITHUB_REPOSITORY}:${tag}"
          docker build -t "$image" .
          echo "IMAGE_TAG=${tag}" >> "$GITHUB_ENV"
          echo "IMAGE_REF=${image}" >> "$GITHUB_ENV"
          {
            echo "source=$(git rev-parse HEAD)"
            echo "digest=local-build"
            echo "image=${image}"
          } | tee verification.txt

      # ignore-unfixed keeps HIGH and CRITICAL. It fails a finding that has a
      # fixed version and skips one Debian has not packaged a fix for.
      # CVE-2023-45853 is Debian will_not_fix: the report is minizip in zlib's
      # contrib, and that code is not built into zlib1g.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_REF }}
          output-file: sbom.spdx.json
          format: spdx-json
          upload-release-assets: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ env.IMAGE_TAG }}
          path: |
            sbom.spdx.json
            verification.txt

      # This job builds a local image for Trivy. It does not push, so it has no
      # registry digest to attest. docker-image.yml attests the digest it pushes.
